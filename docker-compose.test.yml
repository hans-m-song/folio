name: folio-test-dependencies

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: folio_test
      POSTGRES_USER: folio_test
      POSTGRES_PASSWORD: "folio_test_postgres_password"
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready --username=folio_test --dbname=folio_test"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  s3:
    image: quay.io/minio/minio:RELEASE.2025-02-07T23-21-09Z
    command: ["server", "/data", "--address", ":9000"]
    environment:
      MINIO_ROOT_USER: folio_test_access
      MINIO_ROOT_PASSWORD: "folio_test_secret_1234"
    ports:
      - "127.0.0.1:59000:9000"
    volumes:
      - s3_test_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

  s3-init:
    image: quay.io/minio/mc:RELEASE.2025-03-12T17-29-24Z
    depends_on:
      s3:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: folio_test_access
      MINIO_ROOT_PASSWORD: "folio_test_secret_1234"
      TEST_BUCKET: folio-test-artifacts
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set test-s3 http://s3:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "test-s3/$$TEST_BUCKET"
        mc version enable "test-s3/$$TEST_BUCKET"
        mc version info "test-s3/$$TEST_BUCKET"

volumes:
  postgres_test_data:
  s3_test_data:
